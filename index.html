<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>28時間監視 - kimfoods</title>
  <style>
    :root {
      --ok: #16a34a; --warn: #d97706; --over: #dc2626;
      --ok-bg: #dcfce7; --warn-bg: #fef3c7; --over-bg: #fee2e2;
      --primary: #2563eb; --primary-d: #1d4ed8;
      --text: #1f2937; --muted: #6b7280; --line: #e5e7eb; --card: #ffffff; --bg: #f3f4f6;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
      color: var(--text); background: var(--bg); font-size: 17px; line-height: 1.5;
    }
    header {
      background: #111827; color: #fff; padding: 10px 16px;
      display: flex; align-items: center; gap: 14px; position: sticky; top: 0; z-index: 10;
    }
    header h1 { font-size: 18px; margin: 0; font-weight: 700; white-space: nowrap; }
    nav { display: flex; gap: 6px; margin-left: auto; }
    nav button {
      background: #374151; color: #d1d5db; border: none; border-radius: 8px;
      padding: 10px 16px; font-size: 15px; font-weight: 600; min-height: 44px; cursor: pointer;
    }
    nav button.active { background: var(--primary); color: #fff; }
    main { padding: 16px; max-width: 1100px; margin: 0 auto; }
    .screen { display: none; }
    .screen.active { display: block; }

    .banner-over {
      background: var(--over); color: #fff; padding: 14px 18px; border-radius: 10px;
      font-weight: 700; font-size: 18px; margin-bottom: 14px; display: none;
    }
    .banner-over.show { display: block; }

    .toolbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; margin-bottom: 16px; }
    .field { display: flex; flex-direction: column; gap: 4px; }
    .field label { font-size: 13px; color: var(--muted); font-weight: 600; }
    input[type=date], select {
      font-size: 17px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px;
      background: #fff; min-height: 44px; color: var(--text);
    }
    .btn {
      background: var(--primary); color: #fff; border: none; border-radius: 8px;
      padding: 12px 22px; font-size: 16px; font-weight: 700; min-height: 44px; cursor: pointer;
    }
    .btn:active { background: var(--primary-d); }
    .btn.ghost { background: #e5e7eb; color: var(--text); }

    /* --- ダッシュボード カード --- */
    .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
    .card {
      background: var(--card); border-radius: 12px; padding: 16px; border: 1px solid var(--line);
      border-left: 6px solid var(--ok);
    }
    .card.OVER { border-left-color: var(--over); }
    .card.WARN { border-left-color: var(--warn); }
    .card .top { display: flex; align-items: center; justify-content: space-between; }
    .card .name { font-size: 20px; font-weight: 700; }
    .badge {
      font-size: 13px; font-weight: 700; padding: 4px 12px; border-radius: 999px; color: #fff;
    }
    .badge.OK { background: var(--ok); } .badge.WARN { background: var(--warn); } .badge.OVER { background: var(--over); }
    .metrics { display: flex; gap: 18px; margin-top: 12px; }
    .metric { flex: 1; }
    .metric .k { font-size: 12px; color: var(--muted); }
    .metric .v { font-size: 24px; font-weight: 700; }
    .metric .v.warn { color: var(--warn); } .metric .v.over { color: var(--over); }
    .worst { margin-top: 10px; font-size: 14px; color: var(--muted); }

    /* --- 入力 --- */
    .input-grid { display: grid; grid-template-columns: 1fr 360px; gap: 24px; align-items: start; }
    @media (max-width: 820px) { .input-grid { grid-template-columns: 1fr; } }
    .timefields { display: flex; gap: 12px; margin: 16px 0; }
    .timefield { flex: 1; }
    .timefield label { display: block; font-size: 14px; color: var(--muted); font-weight: 600; margin-bottom: 4px; }
    .timebox {
      font-size: 30px; font-weight: 700; text-align: center; padding: 14px 8px; border-radius: 10px;
      border: 2px solid var(--line); background: #fff; cursor: pointer; font-variant-numeric: tabular-nums;
    }
    .timebox.active { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,.15); }
    .timebox .ph { color: #cbd5e1; }
    .jitsu-preview { font-size: 18px; margin: 8px 0 16px; }
    .jitsu-preview b { font-size: 24px; color: var(--primary); }

    .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .keypad button {
      font-size: 26px; font-weight: 700; padding: 18px 0; border-radius: 12px;
      border: 1px solid var(--line); background: #fff; min-height: 60px; cursor: pointer;
    }
    .keypad button:active { background: #eef2ff; }
    .keypad button.util { background: #f3f4f6; font-size: 18px; }

    .save-msg { margin-top: 14px; padding: 12px 14px; border-radius: 10px; font-weight: 600; display: none; }
    .save-msg.ok { display: block; background: var(--ok-bg); color: #065f46; }
    .save-msg.over { display: block; background: var(--over-bg); color: #991b1b; }

    /* --- 詳細テーブル --- */
    .summary { display: flex; gap: 24px; flex-wrap: wrap; margin: 8px 0 16px; }
    .summary .s { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 12px 18px; }
    .summary .s .k { font-size: 12px; color: var(--muted); }
    .summary .s .v { font-size: 22px; font-weight: 700; }
    table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 10px; overflow: hidden; }
    th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
    th { background: #f9fafb; font-size: 13px; color: var(--muted); }
    td.num, th.num { text-align: right; }
    tr.OVER { background: var(--over-bg); }
    tr.WARN { background: var(--warn-bg); }
    .tag { font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 6px; color: #fff; }
    .tag.OK { background: var(--ok); } .tag.WARN { background: var(--warn); } .tag.OVER { background: var(--over); }
    .tag.PROG { background: #6366f1; }
    .loading { color: var(--muted); padding: 20px; }
    .hint { font-size: 13px; color: var(--muted); margin-top: 4px; }
  </style>
</head>
<body>
  <header>
    <h1>28時間監視</h1>
    <nav>
      <button data-screen="dash" class="active">ダッシュボード</button>
      <button data-screen="input">打刻入力</button>
      <button data-screen="detail">スタッフ詳細</button>
    </nav>
  </header>

  <main>
    <!-- ============ 画面1: ダッシュボード ============ -->
    <section id="dash" class="screen active">
      <div class="banner-over" id="dashBanner"></div>
      <div class="toolbar">
        <div class="field">
          <label>基準日</label>
          <input type="date" id="dashToday">
        </div>
        <button class="btn" id="dashRefresh">更新</button>
        <div class="hint">「基準日」時点の直近状況を表示します。</div>
      </div>
      <div class="cards" id="dashCards"><div class="loading">読み込み中…</div></div>
    </section>

    <!-- ============ 画面2: 打刻入力 ============ -->
    <section id="input" class="screen">
      <div class="input-grid">
        <div>
          <div class="toolbar">
            <div class="field">
              <label>スタッフ</label>
              <select id="inStaff"></select>
            </div>
            <div class="field">
              <label>日付</label>
              <input type="date" id="inDate">
            </div>
          </div>

          <div class="timefields">
            <div class="timefield">
              <label>開始</label>
              <div class="timebox" data-time="start"><span class="ph">--:--</span></div>
            </div>
            <div class="timefield">
              <label>終了</label>
              <div class="timebox" data-time="end"><span class="ph">--:--</span></div>
            </div>
            <div class="timefield">
              <label>休憩</label>
              <div class="timebox" data-time="brk"><span class="ph">--:--</span></div>
            </div>
          </div>

          <div class="jitsu-preview">実労働: <b id="jitsuPrev">0:00</b> <span class="hint">（開始・終了が空欄なら休み＝0:00）</span></div>
          <button class="btn" id="saveBtn">保存</button>
          <div class="save-msg" id="saveMsg"></div>
        </div>

        <div>
          <div class="hint" id="kpTarget">入力する枠（開始/終了/休憩）を選んでください</div>
          <div class="keypad" id="keypad">
            <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
            <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
            <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
            <button class="util" data-k="clear">クリア</button>
            <button data-k="0">0</button>
            <button class="util" data-k="back">⌫</button>
          </div>
        </div>
      </div>
    </section>

    <!-- ============ 画面3: スタッフ詳細 ============ -->
    <section id="detail" class="screen">
      <div class="toolbar">
        <div class="field">
          <label>スタッフ</label>
          <select id="detStaff"></select>
        </div>
        <div class="field">
          <label>開始日</label>
          <input type="date" id="detFrom">
        </div>
        <div class="field">
          <label>終了日</label>
          <input type="date" id="detTo">
        </div>
        <button class="btn" id="detShow">表示</button>
      </div>
      <div class="summary" id="detSummary"></div>
      <div id="detTableWrap"><div class="loading">スタッフと期間を選んで「表示」を押してください。</div></div>
      <div class="hint">各行は「その日を起算日とする直後7日間」の実績。判定＝連続7日28時間ルール。</div>
    </section>
  </main>

  <script>
    // ====== 設定 ======
    const API_URL = 'https://script.google.com/macros/s/AKfycbze8e8VH9izp7nfW0Cpyc6wdvCLeIaJHv5ItVFHWIOC_126jxIFBY2iDCJKn0F-7j-O/exec';

    // ====== API ヘルパー ======
    async function apiGet(action, params = {}) {
      const q = new URLSearchParams(Object.assign({ action }, params)).toString();
      const res = await fetch(API_URL + '?' + q);
      const json = await res.json();
      if (!json.ok) throw new Error(json.error || 'APIエラー');
      return json.data;
    }
    async function apiPost(body) {
      // text/plain でプリフライトを避ける（GAS側で JSON.parse）
      const res = await fetch(API_URL, {
        method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(body)
      });
      const json = await res.json();
      if (!json.ok) throw new Error(json.error || 'APIエラー');
      return json.data;
    }

    // ====== 汎用 ======
    const $ = (sel) => document.querySelector(sel);
    const $$ = (sel) => Array.from(document.querySelectorAll(sel));
    const pad2 = (n) => String(n).padStart(2, '0');
    function dateInputToApi(v) { return v ? v.replaceAll('-', '/') : ''; } // 2026-06-15 -> 2026/06/15
    function apiToDateInput(v) { return v ? v.replaceAll('/', '-') : ''; }
    function todayInput() { const d = new Date(); return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }
    function esc(s) { return String(s).replace(/[&<>]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;' }[c])); }

    // 数字文字列 → "h:mm"（末尾2桁=分, 残り=時）。空なら ''。
    function digitsToHHMM(d) {
      if (!d) return '';
      const mm = d.slice(-2).padStart(2, '0');
      const hh = d.length > 2 ? d.slice(0, -2) : '0';
      return `${parseInt(hh, 10)}:${mm}`;
    }
    // "h:mm" 2つの差から休憩を引いた実労働（分）。開始/終了どちらか空→0。
    function toMin(hhmm) { if (!hhmm) return null; const [h, m] = hhmm.split(':').map(Number); return h * 60 + m; }
    function calcJitsu(startHHMM, endHHMM, brkHHMM) {
      const s = toMin(startHHMM), e = toMin(endHHMM);
      if (s == null || e == null) return 0;
      const b = toMin(brkHHMM) || 0;
      return Math.max(0, e - s - b);
    }
    function fmtMin(min) { const s = min < 0 ? '-' : ''; const v = Math.abs(min); return `${s}${Math.floor(v/60)}:${pad2(v%60)}`; }

    // ====== タブ切替 ======
    $$('nav button').forEach(btn => btn.addEventListener('click', () => {
      $$('nav button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      $$('.screen').forEach(s => s.classList.remove('active'));
      $('#' + btn.dataset.screen).classList.add('active');
    }));

    // ====== スタッフ一覧（共有） ======
    let STAFF = [];
    async function loadStaff() {
      STAFF = await apiGet('getStaff');
      const opts = STAFF.map(s => `<option value="${esc(s.staffId)}">${esc(s.name)}（${esc(s.staffId)}）</option>`).join('');
      $('#inStaff').innerHTML = opts;
      $('#detStaff').innerHTML = opts;
    }

    // ====== 画面1: ダッシュボード ======
    async function loadDashboard() {
      const today = dateInputToApi($('#dashToday').value);
      $('#dashCards').innerHTML = '<div class="loading">読み込み中…</div>';
      try {
        const d = await apiGet('getDashboard', { today });
        $('#dashBanner').classList.toggle('show', d.anyOver);
        $('#dashBanner').textContent = d.anyOver ? '⚠ 28時間超過のスタッフがいます' : '';
        if (!d.cards.length) { $('#dashCards').innerHTML = '<div class="loading">対象スタッフがいません。</div>'; return; }
        $('#dashCards').innerHTML = d.cards.map(c => {
          const allowClass = c.tomorrowAllowanceMin <= 0 ? 'over' : (c.tomorrowAllowanceMin < 240 ? 'warn' : '');
          const worst = c.worstWindow ? `直近の最悪窓: ${c.worstWindow.hhmm}（${c.worstWindow.start}起算）` : '直近に完成窓なし';
          return `<div class="card ${c.status}">
            <div class="top"><span class="name">${esc(c.name)}</span><span class="badge ${c.status}">${c.status}</span></div>
            <div class="metrics">
              <div class="metric"><div class="k">直近7日 実績</div><div class="v">${c.last7HHMM}</div></div>
              <div class="metric"><div class="k">明日 働ける残り</div><div class="v ${allowClass}">${c.tomorrowAllowanceHHMM}</div></div>
            </div>
            <div class="worst">${worst}</div>
          </div>`;
        }).join('');
      } catch (e) { $('#dashCards').innerHTML = `<div class="loading">エラー: ${esc(e.message)}</div>`; }
    }

    // ====== 画面2: 打刻入力（カスタムキーパッド） ======
    const timeDigits = { start: '', end: '', brk: '' };
    let activeTime = null;
    function renderTimeBoxes() {
      $$('.timebox').forEach(box => {
        const key = box.dataset.time;
        const hhmm = digitsToHHMM(timeDigits[key]);
        box.innerHTML = hhmm ? esc(hhmm) : '<span class="ph">--:--</span>';
        box.classList.toggle('active', activeTime === key);
      });
      const jitsu = calcJitsu(digitsToHHMM(timeDigits.start), digitsToHHMM(timeDigits.end), digitsToHHMM(timeDigits.brk));
      $('#jitsuPrev').textContent = fmtMin(jitsu);
    }
    $$('.timebox').forEach(box => box.addEventListener('click', () => {
      activeTime = box.dataset.time;
      $('#kpTarget').textContent = { start: '開始', end: '終了', brk: '休憩' }[activeTime] + ' を入力中';
      renderTimeBoxes();
    }));
    $('#keypad').addEventListener('click', (e) => {
      const k = e.target.dataset.k; if (!k) return;
      if (!activeTime) { $('#kpTarget').textContent = 'まず入力する枠を選んでください'; return; }
      let d = timeDigits[activeTime];
      if (k === 'clear') d = '';
      else if (k === 'back') d = d.slice(0, -1);
      else if (d.length < 4) d += k;
      timeDigits[activeTime] = d;
      renderTimeBoxes();
    });

    async function saveLog() {
      const staffId = $('#inStaff').value;
      const date = dateInputToApi($('#inDate').value);
      if (!staffId || !date) { alert('スタッフと日付を選んでください'); return; }
      const start = digitsToHHMM(timeDigits.start);
      const end = digitsToHHMM(timeDigits.end);
      const brk = digitsToHHMM(timeDigits.brk);
      const msg = $('#saveMsg');
      $('#saveBtn').disabled = true;
      try {
        const r = await apiPost({ action: 'addLog', staffId, date, start, end, brk });
        // 保存後、この日を含む窓が28hを超えないか確認（ブロックしない）
        const from = addDaysApi(date, -6), to = date;
        const det = await apiGet('getStaffDetail', { staffId, from, to, today: date });
        const overWins = det.windows.filter(w => w.status === 'OVER' && w.startDate <= date && date <= w.endDate);
        if (overWins.length) {
          msg.className = 'save-msg over';
          msg.innerHTML = `保存しました（実労働 ${r.jitsuHHMM}）。<br>⚠ この入力で次の窓が28時間を超えます:<br>` +
            overWins.map(w => `・${w.startDate}〜${w.endDate}　合計 <b>${w.sumHHMM}</b>`).join('<br>');
        } else {
          msg.className = 'save-msg ok';
          msg.textContent = `保存しました（実労働 ${r.jitsuHHMM}）。28時間超過の窓は発生していません。`;
        }
        timeDigits.start = timeDigits.end = timeDigits.brk = ''; activeTime = null; renderTimeBoxes();
      } catch (e) {
        msg.className = 'save-msg over'; msg.textContent = 'エラー: ' + e.message;
      } finally { $('#saveBtn').disabled = false; }
    }
    // 日付文字列に n 日加算（API形式）
    function addDaysApi(apiDate, n) {
      const [y, m, d] = apiDate.split('/').map(Number);
      const dt = new Date(Date.UTC(y, m - 1, d) + n * 86400000);
      return `${dt.getUTCFullYear()}/${pad2(dt.getUTCMonth()+1)}/${pad2(dt.getUTCDate())}`;
    }
    $('#saveBtn').addEventListener('click', saveLog);

    // ====== 画面3: スタッフ詳細 ======
    async function loadDetail() {
      const staffId = $('#detStaff').value;
      const from = dateInputToApi($('#detFrom').value);
      const to = dateInputToApi($('#detTo').value);
      const today = todayInput().replaceAll('-', '/');
      if (!staffId || !from || !to) { alert('スタッフと期間を選んでください'); return; }
      $('#detTableWrap').innerHTML = '<div class="loading">読み込み中…</div>';
      $('#detSummary').innerHTML = '';
      try {
        const d = await apiGet('getStaffDetail', { staffId, from, to, today });
        const s = d.summary;
        $('#detSummary').innerHTML = `
          <div class="s"><div class="k">月合計</div><div class="v">${s.totalHHMM}</div></div>
          <div class="s"><div class="k">超過窓数</div><div class="v" style="color:${s.overCount?'var(--over)':'inherit'}">${s.overCount}</div></div>
          <div class="s"><div class="k">最大窓</div><div class="v">${s.maxWindowHHMM}</div><div class="k">${s.maxWindowStart||''}起算</div></div>`;
        const rows = d.windows.map(w => {
          const dayMin = w.days[0] ? w.days[0].minsHHMM : '0:00';
          const tag = w.inProgress ? '<span class="tag PROG">進行中</span>' : `<span class="tag ${w.status}">${w.status}</span>`;
          return `<tr class="${w.inProgress ? '' : w.status}">
            <td>${w.startDate}</td>
            <td class="num">${dayMin}</td>
            <td class="num"><b>${w.sumHHMM}</b></td>
            <td>${tag}${w.inProgress ? ` <span class="hint">残り${fmtMin(w.remainingToUpper)}</span>` : ''}</td>
          </tr>`;
        }).join('');
        $('#detTableWrap').innerHTML = `<table>
          <thead><tr><th>日付（起算）</th><th class="num">当日 実労働</th><th class="num">7日合計</th><th>判定</th></tr></thead>
          <tbody>${rows}</tbody></table>`;
      } catch (e) { $('#detTableWrap').innerHTML = `<div class="loading">エラー: ${esc(e.message)}</div>`; }
    }
    $('#detShow').addEventListener('click', loadDetail);

    // ====== 初期化 ======
    (async function init() {
      // 既定日付（シード済みテストデータが見えるように期間2をデフォルト表示）
      $('#dashToday').value = '2026-06-15';
      $('#inDate').value = todayInput();
      $('#detFrom').value = '2026-05-16';
      $('#detTo').value = '2026-06-15';
      $('#dashRefresh').addEventListener('click', loadDashboard);
      renderTimeBoxes();
      try { await loadStaff(); } catch (e) { console.error(e); }
      await loadDashboard();
    })();
  </script>
</body>
</html>
